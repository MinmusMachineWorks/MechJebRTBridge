name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    # Pinned, not ubuntu-latest: CKAN's .deb needs mono-runtime, which ubuntu-26.04 doesn't ship.
    # Matches the image KSPBuildTools' reusable build workflow uses.
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # fetch-depth 0 so MinVer can walk the full tag history
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # compile action does NOT call setup-dotnet — must do it ourselves
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - uses: KSPModdingLibs/KSPBuildTools/.github/actions/setup-ckan@1.1.1

      - uses: KSPModdingLibs/KSPBuildTools/.github/actions/install-dependencies@1.1.1
        with:
          dependency-identifiers: 'MechJeb2 RemoteTech Harmony2'

      - uses: KSPModdingLibs/KSPBuildTools/.github/actions/compile@1.1.1

      - uses: KSPModdingLibs/KSPBuildTools/.github/actions/assemble-release@1.1.1
        id: assemble
        with:
          # Names both the zip and its top-level folder: MechJebRTBridge-vX.Y.Z/GameData/MechJebRTBridge/
          output-file-name: 'MechJebRTBridge-${{ github.ref_name }}'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: 'MechJebRTBridge ${{ github.ref_name }}'
          files: |
            ${{ steps.assemble.outputs.artifact-zip-path }}
            GameData/MechJebRTBridge/MechJebRTBridge.version
          body: |
            ## Installation
            Install via CKAN (add the [Minmus Machine Works mods repository](https://github.com/MinmusMachineWorks/KSP-Mods-CKAN)),
            or copy the zip's `GameData/MechJebRTBridge/` folder into your KSP `GameData/` folder.

            **Dependencies** (CKAN installs these automatically):
            - MechJeb2
            - RemoteTech
            - 000_Harmony

      - name: Publish to CKAN meta repo
        env:
          GH_TOKEN: ${{ secrets.CKAN_META_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP_PATH="${{ steps.assemble.outputs.artifact-zip-path }}"
          ZIP_NAME="$(basename "$ZIP_PATH")"
          # CKAN compares download_hash case-sensitively against uppercase hex; sha256sum prints lowercase
          SHA256=$(sha256sum "$ZIP_PATH" | cut -d' ' -f1 | tr 'a-f' 'A-F')
          SIZE=$(stat -c%s "$ZIP_PATH")

          git clone https://x-access-token:${GH_TOKEN}@github.com/MinmusMachineWorks/KSP-Mods-CKAN.git /tmp/ckan-meta

          cat > "/tmp/ckan-meta/MechJebRTBridge-${VERSION}.ckan" <<EOF
          {
            "spec_version": "v1.4",
            "identifier":   "MechJebRTBridge",
            "name":         "MechJebRTBridge",
            "abstract":     "Routes MechJeb autopilot commands through RemoteTech's signal-delay queue",
            "author":       [ "Machine-Maker" ],
            "license":      "MIT",
            "version":      "${VERSION}",
            "ksp_version_min": "1.8",
            "ksp_version_max": "1.12.5",
            "download":      "https://github.com/MinmusMachineWorks/MechJebRTBridge/releases/download/${GITHUB_REF_NAME}/${ZIP_NAME}",
            "download_size": ${SIZE},
            "download_hash": { "sha256": "${SHA256}" },
            "depends": [
              { "name": "MechJeb2" },
              { "name": "RemoteTech" },
              { "name": "Harmony2" }
            ],
            "install": [
              { "find": "GameData/MechJebRTBridge", "install_to": "GameData" }
            ]
          }
          EOF

          cd /tmp/ckan-meta
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "MechJebRTBridge-${VERSION}.ckan"
          git commit -m "Add MechJebRTBridge ${VERSION}"
          git push
